name: Horizon Blend Backtest
on:
  push:
    branches: [backtest/horizon-xpts-blends]
jobs:
  horizon-blend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run fantasy:backtest-horizon-blend-grid
