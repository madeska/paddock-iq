name: Home UI
on:
  pull_request:
    paths:
      - 'src/app/page.tsx'
      - 'src/app/*dashboard.module.css'
      - 'src/app/style.css'
      - 'src/app/api/market/route.ts'
      - 'src/app/my-team/**'
      - 'scripts/check-home-ui.ts'
      - 'scripts/check-my-team-dashboard-ui.ts'
      - 'src/lib/api-response.ts'
      - 'scripts/check-api-response.ts'
      - 'src/lib/auth.ts'
      - 'src/app/login/**'
      - 'src/app/team/**'
      - 'src/app/privacy/**'
      - 'scripts/check-setup-ui.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/check-deployment-*.mjs'
      - '.github/workflows/home-ui.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.ci.json --noEmit
      - run: npx tsx --test scripts/check-api-response.ts
      - run: npx tsx --test scripts/check-maintenance-auth.ts scripts/check-request-limits.ts scripts/check-team-auth.ts scripts/check-public-horizon.ts
      - run: node --test scripts/check-deployment-config.mjs
      - run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile flows against public fixtures
        run: |
          mkdir src/app/my-team-ui-test-preview
          printf "export {default} from '../my-team/page';\n" > src/app/my-team-ui-test-preview/page.tsx
          mkdir src/app/team-setup-ui-test-preview
          printf "export {default} from '../team/import/page';\n" > src/app/team-setup-ui-test-preview/page.tsx
          npm run dev -- --port 3102 > /tmp/home-ui-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" || true
            rm -f src/app/my-team-ui-test-preview/page.tsx
            rmdir src/app/my-team-ui-test-preview || true
            rm -f src/app/team-setup-ui-test-preview/page.tsx
            rmdir src/app/team-setup-ui-test-preview || true
          }
          trap cleanup EXIT
          node -e 'async function ready(){for(let i=0;i<60;i++){try{if((await fetch("http://localhost:3102")).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}throw Error("UI server not ready")}ready().catch(e=>{console.error(e);process.exitCode=1})'
          npx tsx scripts/check-home-ui.ts
          PADDOCK_TEST_PREVIEW_READY=1 npx tsx scripts/check-my-team-dashboard-ui.ts
          npx tsx scripts/check-setup-ui.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-ui-preview
          path: |
            docs/home-*.png
            docs/my-team-*.png
            docs/team-setup-*.png
            docs/login-*.png
          if-no-files-found: ignore
