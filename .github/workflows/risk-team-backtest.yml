name: Risk Team Backtest
on:
  push:
    branches: [backtest/risk-adjusted-team-ranking]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest-risk-adjusted-team-ranking.ts'
      - '.github/workflows/risk-team-backtest.yml'
jobs:
  risk-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run fantasy:backtest-team-xpts-blends
