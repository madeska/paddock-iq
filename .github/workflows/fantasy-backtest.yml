name: Fantasy Backtest

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fantasy-backtest.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc -p tsconfig.ci.json --noEmit

      - name: Check F1 team import
        run: npm run fantasy:check-team-import

      - name: Check shared and portable forecast inference
        run: |
          npx tsx --test scripts/check-production-forecast.ts scripts/check-tree-forecast-frames.ts scripts/check-prospective-tree-export.ts scripts/check-tree-residual-inference.ts scripts/check-official-historical-price.ts scripts/check-official-price-field-data.ts
          npx tsc --noEmit --incremental false --strict --skipLibCheck --esModuleInterop --resolveJsonModule --target ES2017 --lib esnext,dom --module esnext --moduleResolution bundler scripts/check-snapshot-tree-parity.ts scripts/check-tree-residual-inference.ts scripts/tree-forecast-frames.ts scripts/export-prospective-tree-frames.ts scripts/check-tree-forecast-frames.ts scripts/check-prospective-tree-export.ts

      - name: Check pre-lock weekend sessions and penalty news
        run: |
          npx tsx --test scripts/check-weekend-signals.ts scripts/check-grid-penalty-news.ts scripts/check-weekend-grid-simulation.ts scripts/check-practice-cutoff.ts scripts/check-production-history-replay.ts scripts/check-component-calibration.ts
          npx tsc --noEmit --incremental false --strict --skipLibCheck --esModuleInterop --resolveJsonModule --target ES2017 --lib esnext,dom --module esnext --moduleResolution bundler scripts/check-weekend-signals.ts scripts/check-grid-penalty-news.ts scripts/check-weekend-grid-simulation.ts

      - name: Setup Python for source-independent guards
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check prospective capture and evaluation guards
        run: |
          python scripts/check_capture_tree_forecast.py
          python scripts/check_tree_publication_receipt.py
          python scripts/check_prospective_tree_evaluation.py

      - name: Run selected fantasy backtest
        run: npm run fantasy:backtest-ci
