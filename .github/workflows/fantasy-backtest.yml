name: Fantasy Backtest

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/lib/**"
      - "src/app/api/predictions/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fantasy-backtest.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run selected fantasy backtest
        run: npm run fantasy:backtest-ci
